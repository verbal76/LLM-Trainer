[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtrainer-factory"
version = "0.1.0"
description = "LLM Trainer factory core: manifests, provenance, license gates, datasets, device qualification, export packages."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]
# Real LoRA/QLoRA specialization (NOT needed for CI, the stub pipeline or the reference consumer).
# Install torch separately to match your CUDA/ROCm stack; bitsandbytes is for QLoRA (NVIDIA CUDA).
train = ["torch>=2.3", "transformers>=4.46", "peft>=0.13", "trl>=0.12", "datasets>=2.20", "accelerate>=0.34", "bitsandbytes>=0.43; sys_platform == 'linux'"]

[project.scripts]
llmtrainer = "llmtrainer.cli:main"

[tool.setuptools.packages.find]
include = ["llmtrainer*"]

[tool.setuptools.package-data]
llmtrainer = ["data/**/*.json", "fixtures/**/*.txt", "fixtures/**/*.md", "configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
