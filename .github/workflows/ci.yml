name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: OTA core (JVM) + Python factory tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: OTA core unit tests
        run: ./gradlew --no-daemon :ota-core:test :qualify:test :extract:test :studio-api:test :studio-core:test
      - name: JNI bridge + Kotlin binding on a plain JVM against a stub C engine (-Xcheck:jni; no Android SDK needed)
        run: runtime/host-test/run.sh
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Factory tests
        working-directory: factory
        run: |
          pip install -e ".[test]"
          python -m pytest -q
      - name: Kotlin-produced training job is accepted by the real Python importer (interop)
        working-directory: factory
        run: |
          test -f ../studio-core/build/sample/job.zip
          LLMT_KOTLIN_JOB_ZIP=$PWD/../studio-core/build/sample/job.zip python -m pytest -q tests/test_kotlin_job_interop.py
      - name: Schemas are in sync with code
        working-directory: factory
        run: |
          python -m llmtrainer export-schemas ../schemas
          git -C .. diff --exit-code -- schemas

  android:
    name: Android build + 16 KB packaging + OTA/engine wiring (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Native toolchain pins (single source of truth is gradle.properties)
        id: pins
        run: |
          echo "ndk=$(sed -n 's/^hag.ndkVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "cmake=$(sed -n 's/^hag.cmakeVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      # ubuntu-24.04 runner images preinstall NDK 27.3 (default), 28.2.13676358 (r28c) and 29.x. We pin r28c explicitly
      # and install it here if an image ever stops carrying it.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;${{ steps.pins.outputs.ndk }} cmake;${{ steps.pins.outputs.cmake }}"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: runtime/build/llama.cpp
          key: llama-cpp-${{ hashFiles('native/fetch-llama.sh') }}

      - name: Brand asset is the exact canonical logo
        run: echo "e3d9bb5653eafb783eede827606e7ac73a4e45564a1c25b1ed13ad1429f48c4e  branding/hot-attic-games/studio-logo.png" | sha256sum -c -

      - name: JVM unit tests of the Android-side modules (host API rules, runtime handle/UTF-8/unavailable paths)
        run: ./gradlew --no-daemon :host-api:test :runtime:testDebugUnitTest

      - name: Ephemeral CI OTA key (CI builds only; releases use the real key)
        run: ./gradlew --no-daemon -q :ota-core:run --args="keygen $RUNNER_TEMP/ci-ota"

      - name: Build OTA qualification fixtures
        run: tools/ci/build-ota-fixtures.sh "$RUNNER_TEMP/ci-ota" "$PWD/fixtures"

      - name: Build APKs (native engine for arm64-v8a + x86_64)
        run: |
          echo "NDK pin: ${{ steps.pins.outputs.ndk }}; installed:"; ls "$ANDROID_HOME/ndk" || true
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease \
            -PotaPrivateKeyFile=$RUNNER_TEMP/ci-ota.key -PotaPublicKeyFile=$RUNNER_TEMP/ci-ota.pub -PotaKeyId=ci

      - name: Staged assets + APK contents (diagnostic)
        run: |
          echo "--- generated assets"; find app/build/generated/hag-assets -type f -exec ls -l {} + || true
          echo "--- bundle outputs"; find bundle/build/ota -maxdepth 1 -type f -exec ls -l {} + || true
          echo "--- debug apk assets + libs"; unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/|lib/" || true
          echo "--- release apk libs"; unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "lib/" || true

      - name: 16 KB page-size + native packaging gate (debug APK)
        run: tools/ci/check-16kb.sh app/build/outputs/apk/debug/app-debug.apk debug

      - name: Release-path rehearsal (throwaway keystore, ephemeral OTA key)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/rehearsal.jks" -storepass rehearsal -keypass rehearsal \
            -alias rehearsal -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Rehearsal"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/rehearsal.jks" ANDROID_KEYSTORE_PASSWORD=rehearsal \
          ANDROID_KEY_ALIAS=rehearsal ANDROID_KEY_PASSWORD=rehearsal \
          ./gradlew --no-daemon :app:assembleRelease -PhostVersionCode=1 -PhostVersionName=0-rehearsal \
            -PotaPrivateKeyFile=$RUNNER_TEMP/ci-ota.key -PotaPublicKeyFile=$RUNNER_TEMP/ci-ota.pub -PotaKeyId=ci
          cp app/build/outputs/apk/release/app-release.apk LLM-Trainer-rehearsal.apk
          tools/ci/verify-apk.sh LLM-Trainer-rehearsal.apk "$RUNNER_TEMP/ci-ota.pub" ci 0-rehearsal
          tools/ci/check-16kb.sh LLM-Trainer-rehearsal.apk release

      - name: Logo inside APK is byte-identical
        run: |
          H=e3d9bb5653eafb783eede827606e7ac73a4e45564a1c25b1ed13ad1429f48c4e
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/branding/studio-logo.png | sha256sum | grep -q "$H"
          unzip -p app/build/outputs/apk/release/app-release.apk assets/branding/studio-logo.png | sha256sum | grep -q "$H"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: OTA + host/engine wiring qualification on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI_KEY: ${{ runner.temp }}/ci-ota
          FIXTURES: ${{ github.workspace }}/fixtures
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # ONE line: the action runs each script line in its own shell, so the script itself must carry the exit status.
          script: bash tools/ci/run-app-tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ota-core/build/reports
          if-no-files-found: ignore

  native-engine:
    name: Native engine on emulator (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: api36, target: google_apis }
          - { id: ps16k, target: google_apis_ps16k }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Native toolchain pins
        id: pins
        run: |
          echo "ndk=$(sed -n 's/^hag.ndkVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "cmake=$(sed -n 's/^hag.cmakeVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;${{ steps.pins.outputs.ndk }} cmake;${{ steps.pins.outputs.cmake }}"
      - uses: gradle/actions/setup-gradle@v4

      # The 16 KB page-size image is probed, not assumed: if it is not published for this SDK channel the leg is skipped
      # with a loud warning (the static 16 KB ELF + zip-alignment gates in the android job still run).
      - name: Resolve emulator system image
        id: img
        run: |
          sdkmanager --list 2>/dev/null | grep -E 'system-images;android-3[0-9];(google_apis|google_apis_ps16k);x86_64' | sed 's/|.*//' | sort -u || true
          T=${{ matrix.target }}
          for API in 36 35; do
            if sdkmanager --list 2>/dev/null | grep -q "system-images;android-$API;$T;x86_64"; then
              echo "api=$API" >> "$GITHUB_OUTPUT"; echo "available=true" >> "$GITHUB_OUTPUT"
              echo "using system-images;android-$API;$T;x86_64"; exit 0
            fi
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$T" = google_apis_ps16k ]; then
            case "$GITHUB_REF" in
              refs/heads/release/*|refs/heads/main) echo "::error::No 16 KB page-size x86_64 system image found in sdkmanager; release/main refuses to skip the 16 KB emulator leg."; exit 1 ;;
              *) echo "::warning::No 16 KB page-size x86_64 system image found in sdkmanager; the ps16k emulator leg is SKIPPED on this ref." ; exit 0 ;;
            esac
          fi
          echo "::error::system image system-images;android-36;$T;x86_64 not found"; exit 1

      - uses: actions/cache@v4
        with:
          path: runtime/build/llama.cpp
          key: llama-cpp-${{ hashFiles('native/fetch-llama.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/hag-models
          key: hag-models-smollm2-135m-instruct-v1

      - name: Fetch + verify real test models (sha256 and size taken from the Hugging Face API)
        run: python3 tools/ci/fetch-test-models.py "$HOME/hag-models" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Ephemeral CI OTA key + fixtures
        run: |
          ./gradlew --no-daemon -q :ota-core:run --args="keygen $RUNNER_TEMP/ci-ota"
          tools/ci/build-ota-fixtures.sh "$RUNNER_TEMP/ci-ota" "$PWD/fixtures"

      - name: Pre-build native engine + test APKs (x86_64)
        if: steps.img.outputs.available == 'true'
        run: |
          ./gradlew --no-daemon -Phag.abis=x86_64 :runtime:assembleDebugAndroidTest :app:assembleDebugAndroidTest \
            -PotaPrivateKeyFile=$RUNNER_TEMP/ci-ota.key -PotaPublicKeyFile=$RUNNER_TEMP/ci-ota.pub -PotaKeyId=ci -PotaFixturesDir=$PWD/fixtures
          find runtime/build -name 'lib*.so' -path '*x86_64*' -exec ls -l {} + | head

      - name: Enable KVM
        if: steps.img.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Engine tests on emulator (API ${{ steps.img.outputs.api }}, ${{ matrix.target }})
        if: steps.img.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECT_PAGE_SIZE: ${{ matrix.id == 'ps16k' && '16384' || '' }}
          HAG_ABIS: x86_64
          CI_KEY: ${{ runner.temp }}/ci-ota
          FIXTURES: ${{ github.workspace }}/fixtures
          MODELS_DIR: /home/runner/hag-models
        with:
          api-level: ${{ steps.img.outputs.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          cores: 4
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 10G
          disable-animations: true
          script: bash tools/ci/run-native-tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-engine-reports-${{ matrix.id }}
          path: |
            runtime/build/reports/androidTests
            runtime/build/outputs/androidTest-results
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
