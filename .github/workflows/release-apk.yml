name: Release APK

# Manual, owner-authorized only. Builds, qualifies and publishes LLM-Trainer-v<version>.apk as a GitHub Release asset.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Host release number (integer), e.g. 1 -> tag v1, LLM-Trainer-v1.apk"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true
  # Owner-authorized alternative trigger: pushing branch `release/v<N>` runs the same gated path
  # (the workflow publishes the real release tag `v<N>` itself, only after every gate passes).
  push:
    branches: ["release/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve version
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#release/v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Validate inputs and secrets
        env:
          A: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          B: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          C: ${{ secrets.ANDROID_KEY_ALIAS }}
          D: ${{ secrets.ANDROID_KEY_PASSWORD }}
          E: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "version must be an integer"; exit 1; }
          for v in A B C D E; do [ -n "${!v}" ] || { echo "::error::Missing signing secret(s). Add ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, OTA_SIGNING_KEY (see docs/OTA.md)."; exit 1; }; done
      - uses: actions/checkout@v4
      - name: Tag must not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then echo "::error::tag v$VERSION exists"; exit 1; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :ota-core:test :qualify:test :extract:test :studio-api:test :studio-core:test

      - name: Restore signing material
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          OTA: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s' "$OTA" > "$RUNNER_TEMP/ota.key"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # ---- qualification gate with an ephemeral key + fixtures (same tests as CI) ----
      - name: Ephemeral qualification key
        run: ./gradlew --no-daemon -q :ota-core:run --args="keygen $RUNNER_TEMP/ci-ota"
      - name: Build qualification fixtures
        run: |
          K="-PotaPrivateKeyFile=$RUNNER_TEMP/ci-ota.key -PotaKeyId=ci"
          F="$PWD/fixtures/ota-fixtures"; mkdir -p "$F"
          ./gradlew --no-daemon -q :bundle:packBundle $K -PbundleVersion=2 -PbundleOut="$F/bundle-2-good.hagb"
          ./gradlew --no-daemon -q :bundle:packBundle $K -PbundleVersion=3 -PfaultMode=selftest_fails -PbundleOut="$F/bundle-3-selftest.hagb"
          ./gradlew --no-daemon -q :bundle:packBundle $K -PbundleVersion=4 -PnativeAbi=2 -PbundleOut="$F/bundle-4-abi2.hagb"
          ./gradlew --no-daemon -q :bundle:packBundle $K -PbundleVersion=5 -PfaultMode=entry_throws -PbundleOut="$F/bundle-5-throws.hagb"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: OTA qualification on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            -PotaPrivateKeyFile=$RUNNER_TEMP/ci-ota.key -PotaPublicKeyFile=$RUNNER_TEMP/ci-ota.pub -PotaKeyId=ci
            -PotaFixturesDir=$PWD/fixtures

      # ---- real release build ----
      - name: Build release APK (real keys)
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PhostVersionCode=$VERSION -PhostVersionName=$VERSION \
            -PotaPrivateKeyFile=$RUNNER_TEMP/ota.key
      - name: Name + verify artifact
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "LLM-Trainer-v$VERSION.apk"
          tools/ci/verify-apk.sh "LLM-Trainer-v$VERSION.apk" ota/keys/prod.pub k1 "$VERSION"
          sha256sum "LLM-Trainer-v$VERSION.apk" | tee "LLM-Trainer-v$VERSION.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ inputs.prerelease }}
        run: |
          FLAGS=""; [ "$PRE" = "true" ] && FLAGS="--prerelease"
          gh release create "v$VERSION" "LLM-Trainer-v$VERSION.apk" "LLM-Trainer-v$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" --title "LLM Trainer v$VERSION" $FLAGS \
            --notes "LLM Trainer v$VERSION (host/APK release $VERSION). Contains the Hot Attic Games splash and the OTA/update system. Commit $GITHUB_SHA. Verify with the attached .sha256."
